services:
  localstack:
    container_name: '${LOCALSTACK_DOCKER_NAME:-localstack-main}'
    image: localstack/localstack
    ports:
      - '127.0.0.1:4566:4566' # LocalStack Gateway
      - '127.0.0.1:4510-4559:4510-4559' # external services port range
    environment:
      - DEBUG=${DEBUG:-0}
    volumes:
      - '${LOCALSTACK_VOLUME_DIR:-./volume}:/var/lib/localstack'
      - '/var/run/docker.sock:/var/run/docker.sock'

  myapp:
    image: backend
    container_name: SinisterBees_BACKEND
    command: ['/app/bin/runProject.sh']
    environment:
      - NODE_ENV=production
    ports:
      - '5173:5173'
      - '5000:5000'
    volumes:
      - .:/app
    networks:
      - SinisterBees_network

  db:
    image: postgres:latest
    container_name: SinisterBees_postgres_db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      POSTGRES_DB: testdb
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - SinisterBees_network

  pgadmin:
    image: dpage/pgadmin4
    container_name: pgadmin
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@admin.com
      PGADMIN_DEFAULT_PASSWORD: admin
    ports:
      - '9192:80'
    volumes:
      - pgadmin_data:/var/lib/pgadmin
      - ./config_local.py:/pgadmin4/config_local.py
    networks:
      - SinisterBees_network

  redic:
    image: redis:latest
    container_name: redis
    # command: redis-server --requirepass "indeed_very_strong_password"
    ports:
      - '6379:6379'
    networks:
      - SinisterBees_network

networks:
  SinisterBees_network:
    driver: bridge
volumes:
  postgres_data:
  pgadmin_data:
